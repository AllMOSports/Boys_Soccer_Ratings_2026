# Started by cron-job.org at 2:17 AM Central via GitHub's API (workflow_dispatch),
# because GitHub's own schedule was starting these runs hours late.
# The "Run workflow" button in the Actions tab still works too.
name: Boys Soccer 2026 (games, schedule, ratings)
 
on:
  workflow_dispatch:            # manual runs still work any time
 
permissions:
  contents: write
 
concurrency:
  group: boys-soccer-ratings-2026
  cancel-in-progress: false
 
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          ZONE=$(TZ=America/Chicago date +%Z)
          RUN=false
          if [ -z "$SCHEDULE" ]; then
            RUN=true                                   # manual run
          elif [ "$SCHEDULE" = "17 7 * 8-11 *" ] && [ "$ZONE" = "CDT" ]; then
            RUN=true
          elif [ "$SCHEDULE" = "17 8 * 8-11 *" ] && [ "$ZONE" = "CST" ]; then
            RUN=true
          fi
          echo "Chicago is on $ZONE; trigger '${SCHEDULE:-manual}' -> run=$RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
 
  ratings:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
 
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
 
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
 
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas pillow fonttools brotli
 
      - name: Check required input files
        run: |
          for f in classifications.json mshsaa_schools.csv; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing $f in repo root"
              exit 1
            fi
          done
 
      - name: Scrape, build schedule, run ratings
        run: python Boys_Soccer_Ratings_2026.py | tee ratings_log.txt
 
      - name: Flag teams not in ratings
        if: always()
        run: |
          if grep -q "TEAMS NOT INCLUDED IN RATINGS" ratings_log.txt; then
            echo "::warning::Some classification teams are not in the ratings -- see run log"
            sed -n '/TEAMS NOT INCLUDED IN RATINGS/,/^=====/p' ratings_log.txt >> "$GITHUB_STEP_SUMMARY"
          fi
 
      # Rankings graphics (statewide + each class) from the fresh ratings.
      # Runs only if the ratings step succeeded. continue-on-error means a
      # graphics problem never blocks the ratings/games data from pushing.
      - name: Build rankings graphics
        continue-on-error: true
        run: python Boys_Soccer_Graphics_2026.py
 
      - name: Commit and push outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add boys_soccer_ratings_2026*.json \
                  boys_soccer_rankings_2026_*.csv \
                  boys_soccer_scoreboard_2026.csv
          # Games + schedule files (formerly the separate games scraper
          # and schedule builder).
          git add boys_soccer_games_2026.json boys_soccer_games_2026.csv \
                  boys_soccer_games_2026_all.json boys_soccer_games_2026_all.csv \
                  boys_soccer_schedule_2026.json boys_soccer_schedule_2026.csv \
                  boys_soccer_missing_scores_2026.csv
          # Rankings graphics (+ fonts, in case they were downloaded this run)
          git add graphics/*.png 2>/dev/null || true
          git add fonts/*.ttf 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update Boys Soccer 2026 games, schedule, ratings, graphics ($(date -u +'%Y-%m-%d'))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
