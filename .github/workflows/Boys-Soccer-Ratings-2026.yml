name: Boys Soccer 2026 (games, schedule, ratings)
 
on:
  # Nightly at 2:00 AM Central, Aug-Nov. GitHub cron only runs on UTC,
  # so there are two entries -- one for Daylight time (CDT, UTC-5) and one
  # for Standard time (CST, UTC-6) -- and the "gate" job below lets only
  # the one matching Chicago's current offset go ahead. That keeps it at
  # 2:00 AM local all season, across the Nov 1 time change.
  # GitHub can start scheduled runs late when it's busy (usually minutes).
  schedule:
    - cron: "0 7 * 8-11 *"     # 2:00 AM CDT
    - cron: "0 8 * 8-11 *"     # 2:00 AM CST
  workflow_dispatch:            # manual runs still work any time
 
permissions:
  contents: write
 
concurrency:
  group: boys-soccer-ratings-2026
  cancel-in-progress: false
 
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          ZONE=$(TZ=America/Chicago date +%Z)
          RUN=false
          if [ -z "$SCHEDULE" ]; then
            RUN=true                                   # manual run
          elif [ "$SCHEDULE" = "0 7 * 8-11 *" ] && [ "$ZONE" = "CDT" ]; then
            RUN=true
          elif [ "$SCHEDULE" = "0 8 * 8-11 *" ] && [ "$ZONE" = "CST" ]; then
            RUN=true
          fi
          echo "Chicago is on $ZONE; trigger '${SCHEDULE:-manual}' -> run=$RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
 
  ratings:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
 
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
 
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
 
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas
 
      - name: Check required input files
        run: |
          for f in classifications.json mshsaa_schools.csv; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing $f in repo root"
              exit 1
            fi
          done
 
      - name: Scrape, build schedule, run ratings
        run: python Boys_Soccer_Ratings_2026.py | tee ratings_log.txt
 
      - name: Flag teams not in ratings
        if: always()
        run: |
          if grep -q "TEAMS NOT INCLUDED IN RATINGS" ratings_log.txt; then
            echo "::warning::Some classification teams are not in the ratings -- see run log"
            sed -n '/TEAMS NOT INCLUDED IN RATINGS/,/^=====/p' ratings_log.txt >> "$GITHUB_STEP_SUMMARY"
          fi
 
      - name: Commit and push outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add boys_soccer_ratings_2026*.json \
                  boys_soccer_rankings_2026_*.csv \
                  boys_soccer_scoreboard_2026.csv
          # Games + schedule files (formerly the separate games scraper
          # and schedule builder).
          git add boys_soccer_games_2026.json boys_soccer_games_2026.csv \
                  boys_soccer_games_2026_all.json boys_soccer_games_2026_all.csv \
                  boys_soccer_schedule_2026.json boys_soccer_schedule_2026.csv \
                  boys_soccer_missing_scores_2026.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update Boys Soccer 2026 games, schedule, ratings ($(date -u +'%Y-%m-%d'))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
